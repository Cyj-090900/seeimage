name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build SeeImage.app
        run: ./scripts/build-app.sh release

      - name: Render window preview
        run: |
          BIN="$(swift build -c release --show-bin-path)/SeeImage"
          "$BIN" --snapshot docs/preview.png

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/SeeImage.app build/SeeImage-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SeeImage-macOS
          path: build/SeeImage-macOS.zip

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: docs/preview.png
