<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SeeImage · 单文件图片查看器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }
    main {
      width: min(720px, 100%);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 26px;
      font-size: 15px;
      line-height: 1.75;
      color: #6e6e73;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 18px;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.06);
      color: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.16s ease;
    }
    a.button:hover {
      background: rgba(0, 0, 0, 0.11);
    }
    a.button.primary {
      background: #1d1d1f;
      color: #fff;
    }
    a.button.primary:hover {
      background: #000;
    }
    pre {
      margin: 0;
      padding: 18px 20px;
      overflow: auto;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 12px 28px rgba(0, 0, 0, 0.07);
      font-size: 13px;
      line-height: 1.7;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>SeeImage · 单文件图片查看器</h1>
    <p>
      把「上门超人」macOS 客户端里的预览窗口搬到了浏览器：缩放、平移、旋转、左右翻转、
      图集翻页、拖拽接收、存储图片、浏览器打开原图。零依赖，一个 <code>seeimage.js</code> 搞定。
    </p>
    <div class="actions">
      <a class="button primary" href="demo.html">打开在线示例</a>
      <a class="button" href="https://github.com/Cyj-090900/seeimage">查看源码</a>
      <a class="button" href="seeimage.js">下载 seeimage.js</a>
    </div>
    <pre><code>&lt;script src="seeimage.js"&gt;&lt;/script&gt;
&lt;script&gt;
  SeeImage.open(["/gallery/1.jpg", "/gallery/2.jpg"], 0);
&lt;/script&gt;</code></pre>
  </main>
</body>
</html>
